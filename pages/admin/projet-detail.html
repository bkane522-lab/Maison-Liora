<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Détail du dossier — Espace administrateur — Maison Liora</title>
<link rel="icon" href="/assets/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="nav-interieur">
    <a href="/" class="logo-texte"><span class="logo-monogramme">L</span> Maison Liora <span class="badge" style="margin-left:8px;">Admin</span></a>
    <div class="nav-liens">
      <a href="/pages/admin/dashboard.html">← Tous les dossiers</a>
    </div>
  </div>
</nav>

<section class="section">
  <div class="conteneur" style="max-width: 820px;">
    <div id="chargement"><p>Chargement…</p></div>

    <div id="contenu" style="display:none;">
      <span class="eyebrow" id="type-projet"></span>
      <h1 id="titre-projet" style="margin-bottom:24px;"></h1>

      <div class="grille-2">
        <div>
          <div class="carte" style="margin-bottom:20px;">
            <h3>Statut du dossier</h3>
            <div class="champ">
              <select id="select-statut"></select>
            </div>
            <button class="btn btn-primaire btn-bloc" id="btn-statut">Mettre à jour le statut</button>
          </div>

          <div class="carte" style="margin-bottom:20px;">
            <h3>Questionnaire</h3>
            <div id="detail-questionnaire"></div>
          </div>

          <div class="carte">
            <h3>Fichiers</h3>
            <div id="liste-fichiers" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(100px,1fr)); gap:10px;"></div>
          </div>
        </div>

        <div>
          <div class="carte" style="margin-bottom:20px;">
            <h3>Client</h3>
            <p id="detail-client"></p>
          </div>

          <div class="carte" style="margin-bottom:20px;">
            <h3>Rendez-vous</h3>
            <div id="detail-rdv"><p>Aucun rendez-vous demandé.</p></div>
          </div>

          <div class="carte">
            <h3>Notes internes</h3>
            <div id="liste-notes" style="margin-bottom:16px;"></div>
            <div class="champ">
              <textarea id="nouvelle-note" placeholder="Ajouter une note…"></textarea>
            </div>
            <label style="display:flex; align-items:center; gap:8px; font-size:0.85rem; margin-bottom:12px;">
              <input type="checkbox" id="note-visible-client" style="width:auto;" />
              Visible par le client
            </label>
            <button class="btn btn-secondaire btn-bloc" id="btn-ajouter-note">Ajouter la note</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config/brand.config.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
(async () => {
  const utilisateur = await exigerSession("/login.html");
  if (!utilisateur) return;
  const client = await obtenirClientSupabase();
  const admin = await estAdmin(utilisateur.id);
  if (!admin) { window.location.href = "/dashboard.html"; return; }

  const idProjet = new URLSearchParams(window.location.search).get("id");
  if (!idProjet) { window.location.href = "/pages/admin/dashboard.html"; return; }

  const typesParId = Object.fromEntries(window.BRAND.projectTypes.map((t) => [t.id, t.label]));

  const selectStatut = document.getElementById("select-statut");
  window.BRAND.statuses.forEach((s) => {
    const option = document.createElement("option");
    option.value = s.id;
    option.textContent = s.label;
    selectStatut.appendChild(option);
  });

  async function charger() {
    const { data: projet } = await client
      .from("projects")
      .select("*, profiles:client_id(nom_complet, email, telephone), questionnaires(*)")
      .eq("id", idProjet)
      .single();

    if (!projet) { document.getElementById("chargement").textContent = "Dossier introuvable."; return; }

    document.getElementById("type-projet").textContent = typesParId[projet.type_projet] || "";
    document.getElementById("titre-projet").textContent = projet.titre;
    selectStatut.value = projet.statut;
    document.getElementById("detail-client").innerHTML = `
      ${projet.profiles?.nom_complet || "—"}<br/>${projet.profiles?.email || "—"}<br/>${projet.profiles?.telephone || ""}
    `;

    const questionnaire = projet.questionnaires?.[0];
    if (questionnaire) {
      document.getElementById("detail-questionnaire").innerHTML = `
        <p><strong>Pièces :</strong> ${questionnaire.pieces || "—"}</p>
        <p><strong>Budget :</strong> ${questionnaire.budget || "—"}</p>
        <p><strong>Délai :</strong> ${questionnaire.delai || "—"}</p>
        <p><strong>Description :</strong> ${questionnaire.description || "—"}</p>
        <p><strong>Mesures :</strong> ${questionnaire.longueur_m || "?"}m × ${questionnaire.largeur_m || "?"}m, hauteur ${questionnaire.hauteur_m || "?"}m</p>
        <p><strong>Notes mesures :</strong> ${questionnaire.notes_mesures || "—"}</p>
      `;
    }

    // Fichiers : URLs signées (buckets privés)
    const { data: fichiers } = await client.from("files").select("*").eq("project_id", idProjet);
    const conteneurFichiers = document.getElementById("liste-fichiers");
    for (const fichier of fichiers || []) {
      const { data: urlSignee } = await client.storage.from(fichier.bucket).createSignedUrl(fichier.chemin, 3600);
      const lien = document.createElement("a");
      lien.href = urlSignee?.signedUrl || "#";
      lien.target = "_blank";
      lien.className = "miniature";
      lien.style.cssText = "display:flex; align-items:center; justify-content:center; font-size:0.65rem; text-align:center; padding:4px;";
      lien.textContent = fichier.nom_original;
      conteneurFichiers.appendChild(lien);
    }

    // Rendez-vous
    const { data: rdvs } = await client.from("appointments").select("*").eq("project_id", idProjet).order("created_at", { ascending: false });
    if (rdvs && rdvs.length > 0) {
      document.getElementById("detail-rdv").innerHTML = rdvs.map((r) => `
        <p><strong>${r.date_souhaitee || "—"}</strong> ${r.creneau ? "· " + r.creneau : ""}<br/>
        <span class="badge" style="margin-top:6px;">${r.statut}</span></p>
      `).join("<hr/>");
    }

    await chargerNotes();
    document.getElementById("chargement").style.display = "none";
    document.getElementById("contenu").style.display = "block";
  }

  async function chargerNotes() {
    const { data: notes } = await client.from("project_notes").select("*").eq("project_id", idProjet).order("created_at", { ascending: false });
    const conteneur = document.getElementById("liste-notes");
    conteneur.innerHTML = (notes && notes.length > 0)
      ? notes.map((n) => `
        <div style="padding:10px 0; border-bottom:1px solid var(--bordure);">
          <p style="margin:0;">${n.contenu}</p>
          <p class="aide" style="margin:4px 0 0;">${new Date(n.created_at).toLocaleDateString("fr-FR")} ${n.visible_client ? "· visible client" : "· interne"}</p>
        </div>
      `).join("")
      : "<p class='aide'>Aucune note.</p>";
  }

  document.getElementById("btn-statut").addEventListener("click", async () => {
    const { error } = await client.from("projects").update({ statut: selectStatut.value }).eq("id", idProjet);
    afficherToast(error ? "Erreur lors de la mise à jour." : "Statut mis à jour.", !!error);
  });

  document.getElementById("btn-ajouter-note").addEventListener("click", async () => {
    const contenu = document.getElementById("nouvelle-note").value.trim();
    if (!contenu) return;
    const visibleClient = document.getElementById("note-visible-client").checked;
    const { error } = await client.from("project_notes").insert({
      project_id: idProjet,
      contenu,
      visible_client: visibleClient,
      auteur_id: utilisateur.id,
    });
    if (error) { afficherToast("Erreur lors de l'ajout de la note.", true); return; }
    document.getElementById("nouvelle-note").value = "";
    document.getElementById("note-visible-client").checked = false;
    await chargerNotes();
  });

  charger();
})();
</script>
</body>
</html>
