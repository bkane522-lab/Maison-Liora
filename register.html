<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Créer mon compte — Maison Liora</title>
<link rel="icon" href="/assets/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="nav-interieur">
    <a href="/" class="logo-texte"><span class="logo-monogramme">L</span> Maison Liora</a>
    <div class="nav-liens"><a href="/login.html">Déjà un compte ? Se connecter</a></div>
  </div>
</nav>

<section class="section">
  <div class="conteneur conteneur-etroit">
    <div class="centre">
      <div class="arche-motif"></div>
      <h1>Créer mon compte</h1>
      <p>Quelques informations pour démarrer votre dossier.</p>
    </div>

    <form id="form-inscription" class="carte">
      <div class="champ">
        <label for="nom">Nom complet</label>
        <input id="nom" name="nom" type="text" required autocomplete="name" />
      </div>
      <div class="champ">
        <label for="email">Adresse e-mail</label>
        <input id="email" name="email" type="email" required autocomplete="email" />
      </div>
      <div class="champ">
        <label for="mot-de-passe">Mot de passe</label>
        <input id="mot-de-passe" name="mot-de-passe" type="password" required minlength="8" autocomplete="new-password" />
        <p class="aide">8 caractères minimum.</p>
      </div>
      <div id="message-erreur" class="erreur-texte" style="display:none;"></div>
      <button type="submit" class="btn btn-primaire btn-bloc btn-large" id="btn-inscription">Créer mon compte</button>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script>
  const form = document.getElementById("form-inscription");
  const messageErreur = document.getElementById("message-erreur");
  const bouton = document.getElementById("btn-inscription");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    messageErreur.style.display = "none";
    bouton.disabled = true;
    bouton.textContent = "Création en cours…";

    try {
      const client = await obtenirClientSupabase();
      const nom = document.getElementById("nom").value.trim();
      const email = document.getElementById("email").value.trim();
      const motDePasse = document.getElementById("mot-de-passe").value;

      const { data, error } = await client.auth.signUp({
        email,
        password: motDePasse,
        options: { data: { nom_complet: nom } },
      });
      if (error) throw error;

      // Le profil est aussi créé automatiquement par le trigger SQL
      // handle_new_user (voir supabase/schema.sql) ; on le met à jour
      // ici par sécurité si la session est déjà active.
      if (data.session) {
        await client.from("profiles").update({ nom_complet: nom }).eq("id", data.user.id);
        window.location.href = "/dashboard.html";
      } else {
        afficherToast("Compte créé — vérifiez votre e-mail pour confirmer votre adresse.");
        form.reset();
      }
    } catch (err) {
      messageErreur.textContent = err.message || "Une erreur est survenue.";
      messageErreur.style.display = "block";
    } finally {
      bouton.disabled = false;
      bouton.textContent = "Créer mon compte";
    }
  });
</script>
</body>
</html>
