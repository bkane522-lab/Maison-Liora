<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mot de passe oublié — Maison Liora</title>
<link rel="icon" href="/assets/favicon.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="nav-interieur">
    <a href="/" class="logo-texte"><span class="logo-monogramme">L</span> Maison Liora</a>
    <div class="nav-liens"><a href="/login.html">Retour à la connexion</a></div>
  </div>
</nav>

<section class="section">
  <div class="conteneur conteneur-etroit">
    <div class="centre">
      <div class="arche-motif"></div>
      <h1>Mot de passe oublié</h1>
      <p>Recevez un lien de réinitialisation par e-mail.</p>
    </div>

    <form id="form-reinit" class="carte">
      <div class="champ">
        <label for="email">Adresse e-mail</label>
        <input id="email" name="email" type="email" required autocomplete="email" />
      </div>
      <div id="message-erreur" class="erreur-texte" style="display:none;"></div>
      <div id="message-succes" class="aide" style="display:none; color: var(--succes);"></div>
      <button type="submit" class="btn btn-primaire btn-bloc btn-large" id="btn-reinit">Envoyer le lien</button>
    </form>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script>
  const form = document.getElementById("form-reinit");
  const messageErreur = document.getElementById("message-erreur");
  const messageSucces = document.getElementById("message-succes");
  const bouton = document.getElementById("btn-reinit");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    messageErreur.style.display = "none";
    messageSucces.style.display = "none";
    bouton.disabled = true;

    try {
      const client = await obtenirClientSupabase();
      const email = document.getElementById("email").value.trim();
      const { error } = await client.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/login.html`,
      });
      if (error) throw error;
      messageSucces.textContent = "Si un compte existe pour cet e-mail, un lien vient d'être envoyé.";
      messageSucces.style.display = "block";
      form.reset();
    } catch (err) {
      messageErreur.textContent = err.message || "Une erreur est survenue.";
      messageErreur.style.display = "block";
    } finally {
      bouton.disabled = false;
    }
  });
</script>
</body>
</html>
